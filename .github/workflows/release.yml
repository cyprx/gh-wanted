name: Release

on:
  push:
    branches: [release]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish a release (release branch only)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    if: github.ref == 'refs/heads/release' || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/ci.yml

  version:
    if: github.ref == 'refs/heads/release' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Read package version
        id: version
        shell: bash
        run: |
          version=$(cargo metadata --locked --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "gh-wanted") | .version')
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
      - name: Require an unused version tag
        if: github.ref == 'refs/heads/release' && (github.event_name == 'push' || inputs.publish)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          existing=$(gh api "repos/$GH_REPO/git/matching-refs/tags/$TAG" --jq ".[] | select(.ref == \"refs/tags/$TAG\") | .ref")
          if [ -n "$existing" ]; then
            echo "::error::Tag $TAG already exists. Bump Cargo.toml and Cargo.lock for a new release."
            exit 1
          fi

  build:
    needs: [check, version]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: windows-2022
            target: x86_64-pc-windows-msvc
          - os: macos-14
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install 1.94.0 --profile minimal --target ${{ matrix.target }}
      - name: Build release
        run: cargo +1.94.0 build --locked --release --target ${{ matrix.target }}
      - name: Package Linux and macOS
        if: runner.os != 'Windows'
        shell: bash
        env:
          TAG: ${{ needs.version.outputs.tag }}
          TARGET: ${{ matrix.target }}
        run: |
          mkdir -p dist
          tar -czf "dist/gh-wanted-$TAG-$TARGET.tar.gz" LICENSE -C "target/$TARGET/release" gh-wanted
      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          TAG: ${{ needs.version.outputs.tag }}
          TARGET: ${{ matrix.target }}
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -LiteralPath "target/$env:TARGET/release/gh-wanted.exe", "LICENSE" -DestinationPath "dist/gh-wanted-$env:TAG-$env:TARGET.zip"
      - name: Verify packaged binary and license
        shell: bash
        run: |
          mkdir verify
          if [[ "$RUNNER_OS" == Windows ]]; then
            unzip dist/*.zip -d verify
            binary=./verify/gh-wanted.exe
          else
            tar -xzf dist/*.tar.gz -C verify
            binary=./verify/gh-wanted
          fi
          cmp LICENSE verify/LICENSE
          "$binary" --help
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: release-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    if: github.ref == 'refs/heads/release' && (github.event_name == 'push' || inputs.publish)
    needs: [version, build]
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          pattern: release-*
          merge-multiple: true
          path: dist
      - name: Add checksums
        working-directory: dist
        run: sha256sum *.tar.gz *.zip > SHA256SUMS
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.version.outputs.tag }}
          COMMIT: ${{ github.sha }}
        shell: bash
        run: |
          args=(--repo "$GH_REPO" --target "$COMMIT" --title "gh-wanted $TAG" --generate-notes)
          if [[ "$TAG" == *-* ]]; then
            args+=(--prerelease)
          fi
          gh release create "$TAG" dist/* "${args[@]}"
