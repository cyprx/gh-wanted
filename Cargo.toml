[package]
name = "gh-wanted"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "A terminal watchlist for open-source contributors"

[dependencies]
anyhow = "1"
crossterm = "0.29"
directories = "6"
ratatui = "0.30.2"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
